[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-markets"
version = "0.1.0"
description = "Financial Markets API for data analysis and visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "tzdata==2025.2",
    "six==1.17.0",
    "matplotlib==3.10.7",
    "mplfinance==0.12.10b0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.61.0",
    "kiwisolver==1.4.9",
    "pillow==12.0.0",
    "pyparsing==3.2.5",
    "packaging==25.0",
    "python-dotenv==1.2.1",
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "tinkoff-investments==0.2.0b117",
    "cachetools==5.5.2",
    "grpcio==1.76.0",
    "protobuf==4.25.8",
    "deprecation==2.1.0",
    "typing-extensions==4.15.0",
]

[tool.uv]
exclude-dependencies = ["tinkoff"]

[tool.uv.sources]
tinkoff-investments = { git = "https://github.com/RussianInvestments/invest-python.git", tag = "0.2.0-beta117" }
